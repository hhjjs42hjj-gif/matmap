<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Folkstyle Wrestling Technique Tree</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2630;--text:#f0f6fc;--muted:#9da7b3;--accent:#58a6ff;--line:#30363d;--good:#7ee787}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:16px 20px}
header h1{margin:0 0 6px;font-size:24px} header p{margin:0;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 76px)}
nav{border-right:1px solid var(--line);padding:16px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto;background:var(--panel)}
nav h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--text);padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:5px;font-size:14px}
nav button:hover,nav button.active{background:var(--panel2);border-color:var(--line)}
.search-area{margin:0 0 16px;grid-column:1/-1}
.search-area label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}
#tree-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
#tree-search:focus{outline:2px solid var(--accent);outline-offset:1px}
#search-results{margin-top:8px}
#search-results:empty{display:none}
#search-results button{display:block;margin:0 0 5px;width:100%;background:var(--panel2);border-color:var(--line)}
#search-results small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-status{color:var(--muted);font-size:12px;margin:5px 0 8px}
main{padding:24px;max-width:1200px;width:100%}
.section{display:none;scroll-margin-top:88px}.section.active{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
.section h2{margin:0 0 8px;font-size:28px}.section .sub{color:var(--muted);margin-bottom:18px}
.tree{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;white-space:normal;line-height:1.5;background:#0b0f14;border:1px solid var(--line);border-radius:12px;padding:18px;overflow:auto}.tree-line{display:flex;align-items:flex-start;min-height:1.5em}.tree-prefix{flex:0 0 auto;white-space:pre}.tree-text{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere}
.links{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.links a{display:inline-block;margin:4px 8px 4px 0;padding:5px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2)}
.badge{display:inline-block;font-size:12px;padding:3px 7px;border-radius:999px;background:#17314f;color:#b9dcff;margin-left:8px;vertical-align:middle}
.coach{margin-top:14px;padding:12px 14px;border-left:3px solid var(--good);background:#101820;color:#d9e8df;border-radius:8px}
#top-button{position:fixed;right:22px;bottom:54px;z-index:10;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--text);padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#collapse-button{position:fixed;right:22px;bottom:104px;z-index:10;border:1px solid var(--line);border-radius:999px;background:var(--panel2);color:var(--text);width:42px;height:42px;font:inherit;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#collapse-button:hover{border-color:var(--accent);background:var(--panel)}
#top-button:hover{border-color:var(--accent);background:var(--panel)}
#current-selection{display:none}

.nav-group{margin:4px 0 12px;border:1px solid var(--line);border-radius:10px;background:#111821;overflow:hidden}
.nav-group>button{margin:0;border:0;border-radius:0;font-weight:700;font-size:17px;padding:11px 10px}
.nav-group>button::after{content:'▸';float:right;color:var(--muted);transition:transform .18s ease}
.nav-group.open>button::after{transform:rotate(90deg)}
.nav-submenu{display:none;padding:5px 7px 7px;border-top:1px solid var(--line);background:var(--bg)}
.nav-group.open .nav-submenu{display:block}
.nav-submenu button{font-size:15px;padding:9px 8px;margin-bottom:4px}
.coach-focus-wrap{margin:5px 0 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden}
.coach-focus-toggle{width:100%;margin:0!important;border:0!important;border-radius:0!important;padding:11px 10px!important;font-size:16px!important;font-weight:800!important;text-align:left}
.coach-focus-toggle::after{content:'▸';float:right;color:var(--muted);transition:transform .18s ease}
.coach-focus-wrap.open .coach-focus-toggle::after{transform:rotate(90deg)}
.coach-focus{display:none;padding:14px 13px 16px;font-size:16px;line-height:1.65;color:var(--muted);border-top:1px solid var(--line)}
.coach-focus-wrap.open .coach-focus{display:block}
.coach-focus strong{color:var(--text)}
.coach-focus .focus-title{color:var(--good);font-weight:800;font-size:18px;line-height:1.35;margin-bottom:10px}
.coach-focus .focus-order{color:var(--text);margin-bottom:11px}
.drill-table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.drill-table th,.drill-table td{padding:10px 11px;border:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.4}
.drill-table th{background:var(--panel2)}
.drill-table td:first-child{font-weight:650;width:25%}
.drill-table td:nth-child(2){width:40%}
.drill-note{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--accent);background:#101820;border-radius:8px;color:#d7e8fa}
.drill-kicker{color:var(--accent);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.curriculum-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.curriculum-stat{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px}
.curriculum-stat strong{display:block;font-size:18px;margin-bottom:3px}
.curriculum-stat span{font-size:12px;color:var(--muted)}
.core6-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
.core6-item{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;line-height:1.4}
.core6-item strong{display:block;margin-bottom:4px}
.practice-card{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:14px;margin:12px 0}
.practice-card h3{margin:0 0 6px;font-size:17px}
.practice-card .practice-focus{color:var(--accent);font-weight:700;margin-bottom:7px}
.practice-card p{margin:6px 0;line-height:1.45}
.practice-card .practice-live{color:var(--muted);font-size:13px}
.phase-badge{display:inline-block;font-size:12px;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel2);margin-bottom:10px}
@media(max-width:800px){.curriculum-overview,.core6-grid{grid-template-columns:1fr}}
@media(max-width:800px){.nav-group{grid-column:1/-1}.nav-submenu{grid-template-columns:1fr 1fr}.drill-table{display:block;overflow-x:auto}.drill-table th,.drill-table td{min-width:160px}}

@media(max-width:800px){
  header{position:relative;top:auto}
  .layout{grid-template-columns:1fr}
  nav{position:relative;top:auto;z-index:auto;height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:8px;box-shadow:none;padding:12px}
  .search-area{position:relative;top:auto;z-index:auto;background:var(--panel);padding:0;margin:0 0 8px}
  .nav-group{margin:0 0 8px}
  .nav-submenu{max-height:none;overflow:visible}
  #current-selection{display:none!important}
  main{padding:14px}
  .section{scroll-margin-top:16px}
  .section h2{font-size:23px}
}
</style>
</head>

<header>
  <h1>Folkstyle Wrestling Technique Tree</h1>
  <p>33 interconnected technique trees, 15 drill/progression levels, and a 17-week season curriculum. Use the Drills and Progressions menu to open each level.</p>
</header>

<nav id="nav">

    <div id="search-results" aria-live="polite"></div>
  </div>
</nav>
<div id="current-selection" aria-live="polite">Current: 1. Neutral — Root Position</div><main id="main"></main>

<button id="collapse-button" type="button" aria-label="Collapse menus">−</button>

<script>
const sections = [
{n:1,title:'Neutral — Root Position',tree:`GOOD STANCE + HEAD POSITION + HAND FIGHTING
│
├── Head Position
├── Inside Position
├── Hand Fighting
│   └── Club and Move Opponent
├── Level Changes
├── Fakes
└── Footwork / Angle Creation

Opponent gives:
├── Head → Attack Head
├── Arm → Attack Arm
├── Leg → Attack Leg
└── Pressure → Redirect Pressure`,refs:[2,3,4,5,7,13,30]},
{n:2,title:'Collar-Tie',tree:`COLLAR TIE
│
├── Collar-Tie — You Establish Collar Tie
│   ├── Establish Forehead / Temple Position
│   │   ├── Control Opposite Wrist / Elbow
│   │   └── Club and Move Opponent
│   │
│   ├── Opponent Stays Upright
│   │   └── Snap Down
│   │       └── Front Headlock
│   │           ├── Go Behind
│   │           ├── Near Cradle
│   │           ├── Cow Catcher
│   │           └── Cement Mixer
│   │
│   ├── Opponent Resists Snap / Comes Up
│   │   └── Level Change
│   │       ├── Double Leg
│   │       ├── High Crotch
│   │       ├── Knee Pick
│   │       └── Ankle Pick
│   │
│   ├── Opponent Pushes Into Tie
│   │   ├── Shuck / Slide-By → Go Behind
│   │   └── Short / Sucker Drag
│   │       ├── Single Leg
│   │       └── Rear Position
│   │
│   └── Opponent Reaches / Raises Elbow
│       └── Duck Under
│           ├── Go Behind
│           └── Rear Body Lock
│               ├── Lift
│               └── Mat Return
│
└── Clearing Collar Ties — Opponent Establishes Collar Tie
    ├── CLEAR 1 — ELBOW CONTROL → PASS ARM
    │   ├── Control Opponent's Elbow
    │   ├── Lower Your Head
    │   ├── Pass Opponent's Arm Over Your Head
    │   └── Arm Clears Past Head
    │       └── IMMEDIATE LEG ATTACK
    │           ├── Single Leg
    │           ├── High Crotch
    │           └── Double Leg
    │
    ├── CLEAR 2 — ELBOW PUSH → POST → LEVEL CHANGE
    │   ├── Opposite Hand Pushes Opponent's Elbow
    │   ├── Clear Collar Tie
    │   ├── Post on Opponent's Elbow / Tricep
    │   ├── Lower Level Under the Arm
    │   └── IMMEDIATE LEG ATTACK
    │       ├── Double Leg
    │       ├── High Crotch
    │       ├── Single Leg
    │       └── Low Single
    │
    └── CLEAR 3 — ELBOW + WRIST → BASEBALL-BAT 2-ON-1
        ├── Control Opponent's Elbow
        ├── Opposite Hand Captures Wrist
        ├── Secure Arm With Two Hands
        ├── Treat Captured Arm Like a “Baseball Bat”
        └── Establish 2-on-1 Control
            ├── Immediate Leg Attack
            │   ├── Single Leg
            │   ├── High Crotch
            │   └── Knee Pick
            └── Maintain 2-on-1
                └── Russian / 2-on-1 Tree`,refs:[5,7,8,9,10,11,12],coach:'Clearing branch coaching concept: CLEAR → CREATE OPENING → LEVEL CHANGE → ATTACK.'},
{n:3,title:'Wrist-Control',tree:`WRIST CONTROL
│
├── Opponent Pulls Wrist Back
│   └── Cross-Wrist Pull
│       ├── Single Leg
│       ├── High Crotch
│       └── Duck Under
│
├── Opponent Reaches for Your Wrist
│   ├── Post Near Forehead
│   ├── Snatch Wrist With Opposite Hand
│   └── Pull Wrist Toward Mat
│       ├── Low Single
│       └── Blast Double
│
└── Opponent Controls Your Wrist
    ├── Point Elbow Out
    ├── Biceps Curl Wrist to Chest
    ├── Clear Grip
    └── Immediately Reattack
        ├── Re-Grab Wrist
        ├── Underhook
        ├── Arm Drag
        └── Shot`,refs:[4,7,8,9,10,11]},
{n:4,title:'Underhook',tree:`UNDERHOOK
│
├── Establish
│   ├── Head Position
│   ├── Deep Underhook
│   └── Wrist / Elbow Control
│
├── Opponent Stays Square
│   └── Push / Pull
│       ├── Knee Pick
│       └── High Crotch
│
├── Opponent Circles Away
│   └── Outside Leg Hook
│       └── Osoto Gari
│
├── Opponent Pushes Into You
│   ├── Hip Toss
│   └── Duck / Throw-By
│
├── Opponent Bends Forward
│   └── Snap
│       └── Front-Headlock Tree
│
└── Opponent Overhooks / Whizzers
    ├── Maintain Head Position
    ├── Knee / Leg Attack
    ├── Body-Lock Opportunity
    └── Whizzer Battle / Scramble`,refs:[12,14,28]},
{n:5,title:'Russian 2-on-1',tree:`RUSSIAN / 2-ON-1
│
├── Opponent Stays Upright
│   ├── Knee Pick
│   └── Single Leg
│
├── Opponent Pulls Arm Back
│   └── Drag → Rear Position
│
├── Opponent Pushes Into You
│   └── Lateral Drop
│
├── Opponent Squares Strongly
│   └── Inside Step → Uchi Mata
│
└── Opponent Turns Away
    └── Rear Body Lock`,refs:[10,15]},
{n:6,title:'Snapdowns',tree:`SNAPDOWNS
│
├── Principles
│   ├── Block and Inside Tie
│   ├── Pressure Into Opponent
│   ├── Circle or Fake Shot to Square the Stance
│   ├── Clear Tie Unless Holding Under Elbow
│   ├── Pull in a Downward and Circular Motion
│   ├── Step Lead Leg Back
│   └── Pull Down using upper body (not just arms) Into Mat
│       ├── Go Behind
│       └── Front Headlock
│
├── Starting Positions
│   ├── Thumb Block + Inside Shoulder Tie
│   ├── Thumb Block + Collar Tie
│   ├── Collar-Tie + Drape
│   └── Over-Tie Opponent's Collar-Tie + Inside Tie
│
├── Clearing Ties
│   ├── Thumb Block
│   │   └── Circle → Step Back → Snap at the Wrist
│   ├── Collar Tie
│   │   └── Circle Away From the Tie → Roll Chin Down to Chest → Snap With Upper Body
│   └── Elbow Control
│       ├── Keep Inside Tie
│       ├── Square Opponent's Stance
│       └── Snap Down to Open Space Between Bodies
│           └── Triangle Point: From Squared Feet to Open Space in Front
│
└── Control Opponent on Mat
    ├── Inside Tie Both Armpits — Cobra Tie / Preying Mantis
    │   └── Snap to Elbow → Circle Toward Leg
    │       ├── Cross Block
    │       └── Drag
    ├── Chin and Tricep — Front Headlock
    └── Underhook`,refs:[2,4,12]},
{n:7,title:'Shots/Shot Recovery',tree:`CREATE OPENING
│
└── Pressure, Fake, Level Change
    ├── Double Leg
    ├── High Crotch
    ├── Head-Inside Single
    ├── Sweep Single
    ├── Low Single
    └── Shot Recovery
        ├── Post Hand
        ├── Tripod
        ├── Knee Slide
        ├── Run the Corner
        └── Split the Middle`,refs:[8,9,10,11,30]},
{n:8,title:'Double-Leg',tree:`DOUBLE LEG
│
├── Setup
│   └── Club and Move Opponent → Level Change → Double Leg
│
├── Good Penetration
│   ├── Head Up
│   └── Hips Underneath
│
├── Opponent Stays Tall
│   └── Blast Through
│
├── Opponent Sprawls Lightly
│   ├── Turn Corner
│   ├── Elevate Legs
│   └── Finish
│
├── Opponent Sprawls Heavily
│   ├── Convert to Single
│   └── Peak Out
│
└── Opponent Stuffs Head
    ├── Put Forehead Onto Crook of the Arm
    └── Protect Against Front Headlock`,refs:[10,12,15]},
{n:9,title:'High-Crotch',tree:`HIGH CROTCH
│
├── Opponent Stays Upright
│   └── Come Up → Double Finish
│
├── Opponent Moves Leg Outside
│   └── Convert to Single
│
├── Opponent Squares Hips
│   └── Run Corner
│
├── Opponent Sprawls
│   ├── Peak Out → Rear Position
│   └── Crackdown
│       ├── Shelf Leg
│       ├── Cartwheel
│       ├── Trap Arm and Roll to Back
│       └── Head Hunt to Cradle
│
└── Defend Against High Crotch
    ├── Hip Pressure → Push Head Away
    ├── Get Long → Circle
    └── If Cracked Down
        ├── Sit the Corner → Grab Hamstring + Tight Waist → Scoot and Step Over Leg → Look for a Cradle
        └── Both Hands Pull In Closest Leg → Step Over Leg for Go-Behind or Lock Cradle`,refs:[8,10,14,15,21]},
{n:10,title:'Single-Leg',tree:`SINGLE LEG CAPTURED
│
├── Leg Stays Low
│   ├── Run Corner
│   ├── Shelf
│   └── Cover
│
├── Leg Comes Up
│   └── Shelf Leg
│       ├── Opponent Hops → Far Ankle → Finish
│       └── Boot Scoot → Finish
│
├── Opponent Whizzers
│   ├── Head Up
│   ├── Keep Leg
│   └── Shin-Whizzer Battle
│       ├── Shelf Leg
│       │   └── Run Corner (Hip to Hip) → Pull Ankle to Lift Leg onto Quad → Secure Opposite Ankle → Finish Takedown
│       ├── Limp Arm
│       │   └── Turn Upper Body Away → Slide Arm Out of Whizzer → Cover Hips
│       ├── If Pulled Up to Seatbelt Position
│       │   ├── Rotate Opponent Around Your Body → Finish With Bear Hug → Finish With Head-Wrapped Half Nelson
│       │   └── Knee Position → Use Leg to Block Opponent's Knee → Push Head Away → Step Over
│       └── Reach Free Arm Behind Hamstring → Roll Through
│
├── Opponent Pushes Head Down
│   ├── Recover Head Position
│   ├── Peak-Out Opportunity
│   └── Split the Middle (Iranian)
│       └── Tripod and Knee Slide While Lifting Opponent Onto Your Back
│
└── Opponent Turns Hips Away
    └── Turk
        ├── Takedown
        └── Immediate Near Fall`,refs:[14,15,21,28]},
{n:11,title:'Low-Single',tree:`LOW SINGLE
│
├── Secure Ankle / Heel
│
├── Opponent Falls Toward Hip
│   ├── Cover Hips
│   └── Shelf Leg
│
├── Opponent Turns Away
│   └── Turk
│
├── Opponent Stays Upright
│   └── Climb Leg
│       └── Single-Leg Tree
│
└── Opponent Sprawls
    ├── Maintain Head Position
    └── Come Out Rear / Side`,refs:[10,15]},
{n:12,title:'Front-Headlock',tree:`FRONT HEADLOCK
├── Chin + Arm
└── Head in Hole
    │
    ├── Opponent Stays on Knees
    │   └── Circle Behind
    │
    ├── Opponent Posts Hard
    │   └── Cow Catcher
    │       └── Opponent Resists → Cement Mixer
    │
    ├── Head and Knee Come Together
    │   └── Near Cradle
    │       ├── Lock
    │       ├── Turn
    │       └── Near Fall / Pin
    │
    ├── Opponent Drives Into You
    │   └── Pancake → Chest-to-Chest Pinning
    │
    ├── Opponent Pushes Back With Extreme Force
    │   ├── Release Underhook
    │   └── Shuck → Go Behind
    │
    └── Opponent Stands Up / Posts Leg
        ├── Double Leg
        └── High Crotch`,refs:[21,15]},
{n:13,title:'Neutral-Defense',tree:`OPPONENT ATTACKS / PENETRATES
│
├── FIRST LINE — HEAD
│   ├── Head / Shoulder Block
│   └── Maintain Head Position
│
├── SECOND LINE — HANDS / INSIDE FRAME
│   ├── Down Block
│   ├── Cross Block
│   └── HORN UP
│       ├── Bring Arm / Elbow Up Into Strong Inside Position
│       ├── Create Frame Against Opponent
│       ├── Keep Opponent From Getting Deep to Hips
│       └── Use Frame to Create Separation / Angle
│           ├── Opponent Backs Out
│           │   └── Return to Stance → Reattack
│           ├── Opponent's Head Drops
│           │   └── Snap → Front-Headlock Tree
│           ├── Opponent's Arm Becomes Available
│           │   └── Drag / Shuck → Go Behind
│           └── Opponent Continues Penetrating
│               └── Sprawl
│
├── THIRD LINE — HIPS
│   └── Sprawl
│       ├── Hip Pressure
│       ├── Head / Arm Control
│       └── Create Angle
│
├── Sprawl Successful
│   └── Snap → Front Headlock → Go Behind
│
├── Down Block Successful
│   └── Drag → Get Behind
│
└── Cross Block Successful
    └── Spin → Rear Control

DEFENSIVE PROGRESSION:
HEAD → HANDS / HORN UP → HIPS → ANGLE → COUNTERATTACK → SCORE`,refs:[12,14,28],coach:'Horning up sits between head/hands defense and full hip defense. The goal is not merely to stop the shot, but to create the next attack.'},

{n:29,title:"Defense: Referee's Position",tree:`DEFENSE — REFEREE'S POSITION
│
├── Defense Against Legs In
│   ├── As Hook Is Coming In → Keep Elbows and Knees Connected → Catch Leg and Push Away
│   ├── Leg Already In → Step Free Leg Out to the Side → Seal With Same-Side Arm → Hand Fight → Rotate Around With Head Into Armpit → Cover for Reversal
│   ├── Sit Out Onto Hip With Hook In → Pull Sole of Foot Straight Out → Clear Hook
│   ├── Hook Cleared → Slide Down Low to Mat → Hip Heist → Circle to Stance
│   └── If Power Half In → Get Hips High → Swim Arms to Release Pressure → Head Hunt
│
├── Defense Against Arm Bar
│   ├── Before Bar Is Set → Keep Elbow Close + Protect Wrist
│   ├── Bar Secured → Look Into Bar → Push Hips Away
│   ├── Build Base + Recover Elbow Toward Ribs When Space Opens
│   └── Arm Cleared → Hand Control → Stand Up / Escape
│
├── Defense Against Cradle
│   ├── Before Lock → Keep Head and Knee Apart
│   ├── Fight Hands → Prevent Hands From Connecting
│   ├── Lock Secured → Control Their Hands With Both Hands
│   ├── Create Space Between Head and Knee → Work to Break Lock
│   ├── Lock Broken → Turn Toward Belly → Rebuild Base
│   └── If On Back → Bridge Into Opponent → Fight Lock
│
├── Defense Against Tilts
│   ├── Before Tilt → Protect Wrists + Keep Elbows Close
│   ├── Wrist Captured → Hand Fight → Recover Wrist
│   ├── Opponent Loads Your Hips → Widen Base + Keep Weight Centered
│   ├── Being Tilted → Fight Hand Control + Work Hips Toward Mat
│   └── Control Cleared → Turn Toward Belly → Rebuild Base
│
└── Defense Against Peterson Roll — You Are on Top
    ├── Recognize Trapped Arm + Opponent Reaching for Your Leg
    ├── Free Trapped Hand / Wrist Before Roll Starts
    ├── Move Targeted Leg Out of Reach → Keep a Wide Base
    ├── Follow Hips → Avoid Driving Across Their Shoulders Into Roll
    └── If Rolled → Clear Arm Control → Turn Toward Belly → Recover`,refs:[23,24,26,27]},
{n:30,title:'Defense: Neutral',tree:`DEFENSE — NEUTRAL

│   ├── Lift

    └── After Landing → Clear Control → Belly / Base → Recover`,refs:[12,13,14,31,32],coach:'Start each drill before the hold is fully secured, then add controlled resistance. Once a hold is locked, the exact escape depends on the grip and body position; stop and reset if the neck or shoulder is trapped.'},

function updateSearch(){
  const query=searchInput.value.trim().toLocaleLowerCase();
  searchResults.replaceChildren();
  if(!query)return;
  const terms=query.split(/\s+/);

  const skillMatches=sections.map(s=>{
    const lines=s.tree.split('\n').map(line=>line.replace(/^[\s│├└─]+/g,'').trim()).filter(Boolean);
    const haystack=(s.title+' '+s.tree).toLocaleLowerCase();
    const titleHit=s.title.toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'skill',item:s,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const drillMatches=drillLevels.map(level=>{
    const lines=level.rows.flatMap(r=>r).map(String);
    const haystack=(level.title+' '+lines.join(' ')+' '+(level.group||'')+' '+(level.note||'')).toLocaleLowerCase();
    const titleHit=(`Level ${level.n} ${level.title}`).toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'drill',item:level,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const curriculumMatches=curriculumWeeks.map(week=>{
    const lines=[week.phase,week.focus,...week.p.flatMap(p=>p),...curriculumReviews[week.n-1].days,...(week.n>=3?core6.map(x=>x[0]):[])].map(String);
    const haystack=('Week '+week.n+' '+week.range+' '+lines.join(' ')).toLocaleLowerCase();
    const titleHit=('Week '+week.n+' '+week.phase).toLocaleLowerCase().includes(query);
    const matchingLines=lines.filter(line=>terms.every(term=>line.toLocaleLowerCase().includes(term)));
    const hit=terms.every(term=>haystack.includes(term));
    return {type:'curriculum',item:week,titleHit,matchingLines,hit};
  }).filter(m=>m.titleHit||m.hit);

  const matches=[...skillMatches,...drillMatches,...curriculumMatches]
    .sort((a,b)=>Number(b.titleHit)-Number(a.titleHit)||b.matchingLines.length-a.matchingLines.length||a.item.n-b.item.n);

  const status=document.createElement('div');
  status.className='search-status';
  status.textContent=matches.length ? `${matches.length} matching result${matches.length===1?'':'s'}` : 'No matches';
  searchResults.appendChild(status);

  matches.forEach(({type,item,matchingLines})=>{
    const button=document.createElement('button');
    button.type='button';
    if(type==='skill'){
      button.dataset.go=item.n;
      button.textContent=`Skill Tree ${item.n}: ${item.title}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        show(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }else if(type==='drill'){
      button.dataset.drill=item.n;
      button.textContent=`Drill Level ${item.n}: ${item.title}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        showDrill(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }else{
      button.dataset.week=item.n;
      button.textContent=`Curriculum Week ${item.n}: ${item.phase}`;
      button.addEventListener('click',e=>{
        e.preventDefault();
        e.stopPropagation();
        showCurriculum(item.n,true);
        searchInput.value='';
        updateSearch();
      });
    }
    if(matchingLines.length){
      const detail=document.createElement('small');
      detail.textContent=matchingLines.slice(0,2).join(' · ');
      button.appendChild(detail);
    }
    searchResults.appendChild(button);
  });
}
searchInput.addEventListener('input',updateSearch);
searchInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const first=searchResults.querySelector('button[data-go], button[data-drill], button[data-week]');
    if(first){e.preventDefault();first.click()}
  }
  if(e.key==='Escape'){searchInput.value='';updateSearch()}
});

const curriculumGoals = ["Every wrestler can move in stance, defend a basic shot, stand up from bottom, and execute a Tight-Waist Chop → Half Nelson from top.","Every wrestler has a Double Leg and Single Leg entry/finish and can use the Core 6 in short neutral, top and bottom situations.","Every wrestler can use a setup before attacking, use a backup bottom action when the Stand-Up is stopped, and chain a top breakdown into a turn. Establish or clear Collar-Tie and introduce an upper-body Snapdowns action.","Every wrestler can enter and finish a High Crotch, recover from a stopped shot, and still execute the Core 6 under resistance.","Every wrestler can turn a defended shot or front-headlock position into a go-behind or appropriate scoring attack without stopping. Clear the three tie types, snap from the four starts, and secure mat control before scoring.","Every wrestler attacks immediately off the whistle, creates forward pressure, reads the bottom wrestler's reaction, and chains to a wrist, Half Nelson or Tilt. Connect Spiral to low Half-Nelson and read basic defensive reactions.","Every wrestler recognizes a cradle opportunity and can choose between a Half Nelson and Cradle based on the bottom wrestler's position. Recognize Half Cradle and opposite-leg-post stacks alongside Cradle.","Every wrestler can perform the Core 6 at speed and identify a current best neutral attack, top turn and bottom escape.","Every wrestler can finish through strong leg defense, use a basic Crackdown answer, and turn a stopped attack into recovery or reattack.","Every wrestler can attack with an Arm Bar and defend/rebuild from an Arm Bar or Half Nelson while continuing to wrestle. Connect elbow-hook / Arm Bar offense with low-half reaction defense.","Every wrestler can execute a two- or three-action chain from neutral, top and bottom instead of stopping after the first move fails. Chain Snapdowns setups and low-half sit-out counters without losing control.","Every wrestler can create a second attack with misdirection or reattack and apply simple scramble rules while maintaining position. Use selected Gable drills to connect snaps, reactions and reattacks.","Every wrestler understands basic leg-riding offense and defense and begins choosing a top system that fits their strengths.","Every wrestler can state and execute an A-game neutral system, top system and bottom system under live resistance. Choose a reliable Snapdowns chain and low-half finish/counter for the A-game.","Every wrestler can pressure-test the personal A-game through complete scoring sequences and use throws selectively from appropriate tie-ups. Apply selected low-half step-over and standing finishes appropriate to the athlete.","Every wrestler can make correct decisions in score-first, ride-out, escape and late-match situations while using the personal A-game.","Every wrestler can rehearse the complete A-game cleanly at competition speed, solve key scoreboard situations, and finish the week fresh rather than fatigued."];
const curriculumLessonDetails = [[["Stance-motion-sprawl repetitions; level-change and penetration-step movement; 3–5 controlled Stand-Ups.","Partner gives stance/motion cues, then light shot pressure; wrestler defends, recovers stance, and resets position.","15–20 second neutral reaction rounds plus brief bottom starts."],["Build base → Stand-Up → hand control → hip separation reps; repeat both sides.","Top gives light tight-waist pressure, then gradually blocks the first Stand-Up so bottom must keep building and clear hands.","15–20 second bottom escape rounds from referee’s position."],["Tight-Waist Chop → cover → Half Nelson finish reps; emphasize chest pressure and staying behind hips.","Bottom posts or begins to build; top chops immediately, settles pressure, then transitions to Half Nelson.","20-second turn-or-escape rounds from referee’s position."]],[["Pressure/fake → level change → Double Leg entry and finish; immediate cover after the takedown.","Partner squares or gives light sprawl; attacker finishes through, turns corner, or recovers without stopping.","Neutral rounds where the attacker must score with Double Leg or transition to recovery."],["Single Leg entry → head position → run corner/shelf → finish; repeat both sides.","Defender hops, pushes head, or begins Whizzer pressure; attacker maintains position and selects the appropriate finish.","Single-leg live from captured leg, alternating attacker and defender."],["Core 6 circuit: stance/defense, Double Leg, Single Leg, Stand-Up, Tight-Waist Chop, Half Nelson.","Partner gives one realistic reaction in each position; wrestler must continue to the next Core 6 action rather than reset.","Short rotating neutral, top, and bottom rounds."]],[["Collar-Tie movement and clearing ties → pressure/fake → Double Leg; finish with immediate top control. Use both branches of Collar-Tie: establish forehead/temple and wrist/elbow control; clear by elbow pass, elbow push/post, or elbow + wrist to baseball-bat 2-on-1. Introduce Snapdowns: block + inside tie, pressure in, circle/fake to square feet, clear tie unless holding under elbow, pull downward and circularly with upper body (not just arms), step lead leg back, and pull into mat.","Opponent resists the tie or clears it; wrestler creates a second opening and reattacks instead of forcing the first setup. Partner alternates establishing a collar tie and resisting your tie; choose the clear or snap, then attack immediately.","Neutral positional rounds beginning in Collar Tie. Alternate who owns the tie; score by clearing to a leg attack or snapping to go-behind."],["Stand-Up review → Tripod → circle/block; drill first move and backup move continuously.","Top stops the first Stand-Up; bottom immediately transitions to Tripod, clears control, and continues toward escape.","20–30 second bottom rounds where the wrestler must escape after the first move is stopped."],["Tight-Waist Chop → Half Nelson review; add Spiral Ride as the second pressure option.","Bottom posts/builds after the chop; top transitions to Spiral, drives forward, and looks for Half Nelson or wrist control.","Top must break down and turn while bottom actively builds and escapes."]],[["High Crotch entry, posture, penetration, and basic finish; connect from hand fighting.","Opponent squares hips or begins sprawl; attacker adjusts angle and continues to finish rather than freezing underneath.","High-Crotch positional starts."],["Shot Recovery: Post Hand → Tripod → Knee Slide → Run the Corner / Split the Middle.","Partner stops the shot and applies realistic pressure; attacker recovers position and immediately works toward a scoring angle.","Start from a stopped shot and wrestle to score."],["Fast Core 6 review: Stand-Up, Tight-Waist Chop, Half Nelson, Double/Single entries.","Coach calls neutral, top, or bottom; wrestlers execute the first action quickly and transition to short live wrestling.","Alternating 30-second referee’s-position and neutral rounds."]],[["Front Headlock: chin + arm, head position, circle behind, and go-behind finish. Rehearse four Snapdowns starts: thumb block + inside shoulder tie, thumb block + collar tie, collar-tie + drape, and over-tie opponent’s collar-tie + inside tie. On mat: inside tie both armpits (Cobra Tie / Preying Mantis) → snap to elbow → circle toward leg → cross block or drag; also chin + tricep Front Headlock or Underhook.","Opponent stays on knees or blocks the go-behind; wrestler maintains head/arm control and changes angle. Partner changes posts and head position; choose armpit control, chin + tricep, or underhook before circling.","Front-headlock live with 20–30 second scoring windows. Start standing, snap to mat, establish control, then score a go-behind."],["Cow Catcher and Pancake mechanics from Front Headlock reactions; controlled entries only. Clear thumb block: circle → step back → snap at wrist. Clear collar tie: circle away from tie → roll chin to chest → snap with upper body. With elbow control: keep inside tie → square opponent’s stance → snap into open space between bodies, at the triangle point in front of squared feet.","Opponent posts hard or drives forward; wrestler reads the pressure and chooses Cow Catcher, Pancake, or returns to basic go-behind. Partner presents thumb block, collar tie, or elbow control; select the matching clear before front-headlock offense/defense.","Short reaction rounds beginning in Front Headlock. Rotate the three tie starts; attacker must clear, snap, control and score."],["Shot → opponent sprawls → Front Headlock / Crackdown / recovery → score.","Defender changes the reaction each rep; attacker must make a second attack immediately rather than restart.","Neutral live emphasizing second attacks after the first shot is defended."]],[["Spiral Ride entry and forward pressure; keep weight on back, find wrist, follow bottom building. Spiral to opposite side → push head to side → half low on neck. Opening options: one-on-one wrist → 11 o’clock; elbow hook (inside elbow to inside elbow) → sit through → catch elbow → release half → finger walk; Arm Bar; tight waist → block knee → 1 o’clock; thigh pry → 11 o’clock stack with elbow holding opponent up, or track shoes → midnight drive. Teach the entry and one finish first; rotate other options as wrestlers are ready.","Bottom posts or begins to build; top follows the reaction and maintains pressure rather than hanging on one position. Bottom changes wrist, elbow and knee position; top chooses the available opening option.","Top starts in Spiral; bottom actively builds for 20–30 seconds. Begin from Spiral; establish low half and finish with the selected option."],["Near-wrist and cross-wrist control → simple Tilt exposure; keep control through the count.","Bottom protects the wrist or turns hips; top changes control, re-centers pressure, and looks for Half Nelson or another wrist.","20-second tilt-or-escape rounds."],["Whistle start: Tight-Waist Chop or Spiral → create forward pressure → read reaction → Half Nelson / wrist / Tilt. Low-half reactions: wing down or Granby → post on head → limp elbow → knees → stack → elbow into back → elbow hook → finger walk in tight circle. Roll attempt → spin out front with half → head post → elbow into back → knee secures head. Peel attempt → forehead into hand → track shoes → midnight. Flattening → cheek to hand → toes → drive at 12 o’clock.","First breakdown is stopped; top immediately chains to the second breakdown or turn without pausing. Bottom gives one assigned reaction per round, then varies among wing down, roll, Granby, peel or flat.","Top/bottom positional live with scoring; top must attempt at least two connected attacks. Top must follow the reaction and retain control through a second action."]],[["Cradle recognition: head-to-knee relationship, lock position, and controlled finish.","Bottom changes base—inside leg up, outside leg up, sit-out, tripod; top identifies when the cradle appears.","Cradle-recognition rounds from changing bottom positions."],["Spiral → crossface pressure → Cradle; review Half Nelson when cradle is not available. Add Half Cradle from low half: arm behind knee → hook onto bicep → lock → pull over head. Opponent posts opposite leg: crane inside thigh → knees → lift leg → stack, hip down onto arm.","Bottom separates head and knee or posts; top chooses Cradle when available and Half Nelson when the near arm opens. Bottom varies head-knee distance and opposite-leg post; top chooses Cradle, Half Cradle, or leg-lift stack.","Top chooses between Half Nelson and Cradle during positional rounds. Alternate cradle recognition with low-half leg-post reactions."],["Half Nelson and Cradle speed review; focus on pressure, control, and safe finishing.","Bottom actively fights exposure; top must transition between the two turn families instead of forcing one.","Pinning-position live with bottom survival."]],[["Core 6 speed circuit with perfect reps and minimal instruction.","Partner gives varied but familiar reactions; wrestler selects the correct Core 6 response at increasing speed.","Short competitive stations."],["Rehearse each wrestler’s currently best Double Leg, Single Leg, or High Crotch setup and finish.","Defender gives moderate resistance; wrestler identifies which attack remains reliable and which needs work.","Neutral score-first rounds."],["Stand-Up plus preferred top turn: Half Nelson, Cradle, or Tilt; clean repetitions.","Start randomly top or bottom; wrestler immediately uses the chosen first action and then wrestles live.","Mixed-position king-of-the-mat style rounds."]],[["Single Leg finishing positions from mat and standing; head position, corner, shelf, and cover.","Defender establishes Whizzer/Shin-Whizzer pressure; attacker keeps leg control and works to a finish or safe transition.","Single-leg live from mat and standing."],["High Crotch → Crackdown; teach Shelf Leg first, then Cartwheel / trap-arm roll / head-hunt options as appropriate.","Defender sprawls and squares; attacker identifies the Crackdown position and selects the appropriate finish.","Start directly in Crackdown and wrestle to score."],["Shot Recovery → reattack: stopped shot becomes corner, Front Headlock, Crackdown, or second attack.","Partner varies shot defense; attacker must keep wrestling continuously through the failed first attempt.","Continuous neutral rounds with no reset after the first defended shot."]],[["Arm Bar entry, secure position, run bar, and maintain pressure; review Half Nelson. Connect the opening-series elbow hook and finger walk to Arm Bar. Against all fours: left knee into stomach → drive at 12 o’clock → elbow into back → elbow hook.","Bottom stays flat or begins to build; top follows the reaction and keeps control while choosing the finish. Bottom rebuilds to all fours or protects the arm; top follows with low-half pressure, elbow hook or Arm Bar.","Arm-Bar turn-or-escape rounds. Start from low half or partial Arm Bar and wrestle to turn or escape."],["Bottom vs Arm Bar and Bottom vs Half Nelson: clear danger, recover elbow/arm, rebuild base. Review top’s wing-down, Granby, roll, peel and flattening follow-ups so bottom recognizes the next threat while clearing control and rebuilding base.","Top starts with partial control; bottom must first become safe, then rebuild and escape rather than rushing directly to feet. Top selects an established low-half counter; bottom must recover position through the follow-up.","Begin in bad positions and wrestle to escape. Use controlled low-half starts with both wrestlers chaining their next action."],["Top chooses Tight Waist, Spiral, Half Nelson, or Arm Bar; bottom uses Stand-Up/Tripod.","First attack or escape is stopped; both wrestlers immediately chain to their backup action.","30–45 second referee’s-position live rounds."]],[["Neutral chain: Collar Tie / Wrist Control / Underhook → primary attack → backup attack. Include Snapdowns clearing ties and mat control; connect merged Collar-Tie branches to immediate attacks. Use Gable’s Advanced Neutral Drills: baseball-bat grip movement, reverse 2-on-1, elbow tie circle/change levels, and snap-snap → go-behind.","Partner stops the first attack or changes tie position; wrestler immediately moves to the second attack. Partner changes tie and pressure; choose snapdown or leg attack, then maintain mat control or reattack.","Neutral tie-up live with emphasis on two-action chains. Tie-up rounds require a clear/setup followed by two connected actions."],["Top chain: Tight Waist or Spiral → Turn A → Turn B. Against sit-out: momentum drive sideways/up onto shoulders with knee assist and head post; Shoelace (same-side half + same-side shoelace) → 11 o’clock; Limb Throw (arm or inside leg over head); Crusher (knees on half side, pressure and whip into head-wrapped half, elbow to mat, knuckles to chest/sternum); Snapback (release half, underhook + overhook, chin in shoulder). Introduce one response at a time based on readiness.","Bottom blocks the first turn; top maintains pressure and transitions without returning to the start. Bottom sits out with varied momentum; top chooses an appropriate learned response and follows onto chest instead of releasing.","Top stays live through the first failed turn. Sit-out reaction starts; score only when top follows through and maintains control."],["Bottom chain: Stand-Up → Tripod / secondary escape; maintain hand control throughout.","Top blocks the first escape; bottom immediately moves to the backup escape rather than returning to base and waiting.","Referee’s-position live with ride-out scoring."]],[["Misdirection: fake shot, fake snapdown, or throw threat → second attack. Use the full Snapdowns setup and tie-clearing sequence. Add selected Gable drills: catch shot → snap-snap → go-behind; armpit double-post / Preying Mantis frames → pull toward elbow → go-behind, with Pancake or knee tap when the reaction opens it.","Partner reacts honestly to the fake; wrestler attacks the opening created by that reaction. Partner squares feet, posts, or resists the snap; read the reaction and select the next attack.","Neutral rounds where scoring must follow a setup or reaction. Alternate real snapdowns and fake-snap leg attacks without resetting."],["Scramble basics: head higher, protect hips, control a leg, pass/shelf leg, Merkle awareness.","Start in a controlled 50/50 position; wrestlers apply the scramble priorities instead of chasing random movement.","Controlled scramble starts."],["Attack → defense → reattack; blend Shot Recovery, Front Headlock, and Scramble.","Partner changes defense continuously; attacker must keep wrestling through transitions for the full interval.","45-second continuous wrestling bursts."]],[["Leg-Riding entry from Spiral, flattening pressure, wrist control, and basic turn awareness.","Bottom changes base and elbow position; top decides whether to stay with legs, attack a turn, or return to core ride pressure.","Leg-ride positional live."],["Bottom vs Leg Ride: opposite shoulder up, swim arm, build hips, sit-out/tripod to clear hook.","Top follows with moderate pressure; bottom chains clearing actions until the hook is removed and position is recovered.","Bottom starts with leg already in."],["Personal top system: Tight Waist, Spiral, or Legs In based on athlete strength.","Bottom gives different reactions; top chooses the system that produces control rather than forcing a preferred move.","Choice-based top/bottom live with near-fall scoring."]],[["Neutral A-game: primary setup → primary attack → backup attack; high-quality repetitions. Choose one reliable Snapdowns start, the matching tie clear, and a mat-control finish; retain the wrestler’s best leg-attack backup.","Partner gives the most common defense to the primary attack; wrestler executes the predetermined backup. Partner blocks the preferred snap or leg attack; wrestler immediately uses the chosen second option.","Match-like neutral rounds scored by successful A-game execution. Score-first rounds include standing setup through mat control."],["Top A-game: primary breakdown → Turn A → Turn B. Select one low-half opening finish and one reaction counter already learned; practice momentum finish: tight waist + half → pull onto you → throw to side → pull arm in → forearm pressure into head → spin around and follow onto chest.","Bottom blocks Turn A; top maintains control and immediately transitions to Turn B. Bottom blocks the primary turn; top transitions while maintaining control and chest follow-through.","Top must score near-fall or ride out from referee’s position. Require control after exposure rather than letting opponent go."],["Bottom A-game: first escape → backup escape; Stand-Up remains the default first option.","Top stops the first escape; bottom uses the designated backup without hesitation.","Bottom must escape under scoreboard pressure."]],[["Throws by tie: safe entries from Underhook, Over-Under, Body Lock, Front Headlock, and Russian 2-on-1. Review previously learned sit-out counters. Add low-half step-over reaction: drive forward → elbow hook → over head; Merkle → stretch out, or lift/roll over your body and hook leg. Against standing: tight waist → hip → stack over head; or hip pop → snap back to mat; or make opponent lean → step in front → level change → Hip Toss. Select options appropriate to each athlete.","Partner changes tie position; wrestler uses a throw only when the correct tie/reaction exists, otherwise returns to primary offense. Partner steps over or stands; top chooses a controlled return/finish while keeping connection.","Controlled throw-entry positional wrestling. Controlled entries first, then brief step-over and standing reaction rounds."],["Personal chain: A-game neutral attack → Takedown → Top Transition → preferred turn.","Defender gives realistic resistance through the entire sequence; attacker stays connected after the takedown.","Start neutral and continue through score and top control."],["Full-system review through short matches; coach corrects decisions rather than adding new moves.","Between rounds, wrestler identifies where the chain broke and rehearses that transition once before returning live.","High live volume with full scoring."]],[["Neutral A-game speed reps; rehearse score-first and defend-the-lead situations. Rehearse established thumb-block/collar-tie/elbow-control clears → Snapdowns → Cobra Tie / Preying Mantis, Front Headlock or Underhook control.","Coach gives time/score and opponent position; wrestler chooses attack, reattack, or controlled defense based on situation. Opponent changes ties with clock running; wrestler chooses the established scoring chain.","Short high-intensity score-first situations. Use only previously learned options in timed score-first rounds."],["Ride, escape, turn situations: 30 seconds left up one/down one; need escape; need turn; ride-out. Rehearse chosen low-half opening, sit-out/standing counter and momentum follow-through with the score and clock determining the objective.","Coach changes score and clock; wrestler must immediately identify the correct objective before wrestling. Bottom presents a familiar reaction; top chooses turn or secure control based on score.","Scoreboard-driven positional live. Run low-half turn-or-ride-out situations with full scoring."],["Full match simulation including warm-up, between-period choice, and overtime-style situations.","Coach provides short corrections between bouts; no new technique is introduced.","Mostly live wrestling with match pacing and recovery."]],[["A-game checklist: primary setup, takedown, backup attack, shot recovery, breakdown, two turns, first/second escape. Include the established Snapdowns clear → mat control → score and preferred low-half finish/counter with chest follow-through. Review only; no new options.","Partner gives championship-level but controlled resistance; wrestler uses only established techniques. Partner gives familiar reactions; wrestler uses the selected A-game without adding technique.","Moderate live; stop before fatigue changes technique. Keep rehearsals brief and crisp; preserve the existing taper."],["Championship situations: 30 seconds down one/up one, need escape, need takedown, opponent has your leg, Front Headlock, ride-out.","Coach calls situations randomly; wrestler responds immediately using the established system.","Short intense situational rounds with full recovery."],["Perfect reps only: movement → hand fight → 5–10 primary attacks → escapes → breakdowns → turns.","No new reaction chains; correct only major errors and preserve confidence/speed.","Very short competition-speed bursts; taper conditioning and finish fresh."]]];

function linkTreeKeywords(text,currentTree=null){
  let out=String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const placeholders=[];
  for(const [label,n] of treeAliases){
    const esc=label.replace(/[.*+?^$()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(esc,'gi'),match=>{
      const token='@@TREE_LINK_'+placeholders.length+'@@';
      placeholders.push(Number(currentTree)===Number(n)
        ? match
        : '<a href="#section-'+n+'" data-go="'+n+'">'+match+'</a>');
      return token;
    });
  }
  placeholders.forEach((html,i)=>{out=out.replace('@@TREE_LINK_'+i+'@@',html)});
  return out;
}
function addTreeLinks(text,currentTree=null){
  return text.split('\n').map(line=>{
    if(line==='') return '<span class="tree-line">&nbsp;</span>';
    const m=line.match(/^([\s│├└─]*)(.*)$/);
    const prefix=m?m[1]:'';
    const body=m?m[2]:line;
    return `<span class="tree-line"><span class="tree-prefix">${prefix}</span><span class="tree-text">${linkTreeKeywords(body,currentTree)}</span></span>`;
  }).join('');
}

  if(currentSelection) currentSelection.textContent='Current: '+label;
}

function show(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n]').forEach(x=>x.classList.toggle('active',Number(x.dataset.n)===n));
  document.querySelectorAll('nav button[data-drill]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-week], nav button[data-curriculum]').forEach(x=>x.classList.remove('active'));
  skillMenu.classList.add('open');
  skillMenuButton.setAttribute('aria-expanded','true');
  setCurrentSelection(`${n}. ${byNum[n].title}`);
  const target=document.getElementById(`section-${n}`);
  if(target){revealTarget(target);if(push)history.pushState(null,'',`#section-${n}`)}
}

function showDrill(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-week], nav button[data-curriculum]').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-drill]').forEach(x=>x.classList.toggle('active',Number(x.dataset.drill)===n));
  drillMenu.classList.add('open');
  drillMenuButton.setAttribute('aria-expanded','true');
  setCurrentSelection(`Drill Level ${n} — ${drillLevels.find(x=>x.n===n)?.title || ''}`);
  const target=document.getElementById(`drill-level-${n}`);
  if(target){revealTarget(target);if(push)history.pushState(null,'',`#drill-level-${n}`)}
}

function showCurriculum(n,push=false){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('nav button[data-n], nav button[data-drill], nav button[data-week], nav button[data-curriculum]').forEach(x=>x.classList.remove('active'));
  curriculumMenu.classList.add('open');
  curriculumMenuButton.setAttribute('aria-expanded','true');
  const isCore=n==='core';
  if(isCore) coreButton.classList.add('active');
  else document.querySelectorAll('nav button[data-week]').forEach(x=>x.classList.toggle('active',Number(x.dataset.week)===Number(n)));
  setCurrentSelection(isCore ? 'Core 6 — Foundation System' : `Curriculum Week ${n} — ${curriculumWeeks.find(x=>x.n===Number(n))?.range || ''}`);
  const target=document.getElementById(isCore?'curriculum-core':`curriculum-week-${n}`);
  if(target){
    revealTarget(target);
    if(push) history.pushState(null,'',isCore?'#curriculum-core':`#curriculum-week-${n}`);
  }
}

document.addEventListener('click',e=>{
  const core=e.target.closest('[data-curriculum]');
  if(core){e.preventDefault();showCurriculum('core',true);return}
  const week=e.target.closest('[data-week]');
  if(week){e.preventDefault();showCurriculum(Number(week.dataset.week),true);return}
  const drill=e.target.closest('[data-drill]');
  if(drill){e.preventDefault();showDrill(Number(drill.dataset.drill),true);return}
  const a=e.target.closest('[data-go]');
  if(a){e.preventDefault();show(Number(a.dataset.go),true)}
});
window.addEventListener('popstate',()=>{
  if(location.hash==='#curriculum-core'){showCurriculum('core',false);return}
  const w=location.hash.match(/curriculum-week-(\d+)/);
  if(w){showCurriculum(Number(w[1]),false);return}
  const d=location.hash.match(/drill-level-(\d+)/);
  if(d){showDrill(Number(d[1]),false);return}
  const m=location.hash.match(/section-(\d+)/);
  show(m?Number(m[1]):1,false);
});
const initialWeek=location.hash.match(/curriculum-week-(\d+)/);
const initialDrill=location.hash.match(/drill-level-(\d+)/);
const initial=location.hash.match(/section-(\d+)/);
if(location.hash==='#curriculum-core')showCurriculum('core',false);
else if(initialWeek)showCurriculum(Number(initialWeek[1]),false);
else if(initialDrill)showDrill(Number(initialDrill[1]),false);
else show(initial?Number(initial[1]):1,false);
</script>
</body>
</html>
